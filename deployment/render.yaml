services:
  - type: web
    name: disease-prediction-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m ml.train
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEFAULT_MODEL
        value: random_forest
